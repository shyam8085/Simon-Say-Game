<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simon Says Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🎮 Simon Says Game</h1>
  <h2 id="level-title">Press Any Key to Start</h2>

  <!-- Scoreboard -->
  <div class="scoreboard">
    <p>Current Level: <span id="current-level">0</span></p>
    <p>High Score: <span id="high-score">0</span></p>
  </div>

  <!-- Game Buttons -->
  <div class="btn-container">
    <div class="line-1">
      <div class="btn red" id="red">1</div>
      <div class="btn yellow" id="yellow">2</div>
    </div>
    <div class="line-2">
      <div class="btn green" id="green">3</div>
      <div class="btn purple" id="purple">4</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
